<!DOCTYPE html>
<html lang="th">
<head>

<style>
:root{--bg:#f3efe4;--card:#fbf8f0;--ink:#2b2416;--mut:#7a6d55;--line:#d9cfb8;--sf:#8a3b12;--sf2:#f0dcc4;--ok:#3f6b3a;--bad:#a33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a13;--card:#27231a;--ink:#f1e9d6;--mut:#a89c82;--line:#41392a;--sf:#e59a5c;--sf2:#3b2e1d;--ok:#8fc383;--bad:#f08a8a}}
:root[data-theme="dark"]{--bg:#1d1a13;--card:#27231a;--ink:#f1e9d6;--mut:#a89c82;--line:#41392a;--sf:#e59a5c;--sf2:#3b2e1d;--ok:#8fc383;--bad:#f08a8a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Sarabun,"Noto Sans Thai",Tahoma,sans-serif}
header{background:var(--sf);color:#fff8ea;padding:18px 16px}
header h1{margin:0;font-size:1.5rem}header p{margin:2px 0 0;opacity:.85;font-size:.9rem}
main{max-width:1100px;margin:0 auto;padding:14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-start}
.nav-drop{position:relative;display:inline-block}
.nav-drop>button{min-width:7rem}
.nav-drop .sub{
  display:none;position:absolute;left:0;top:100%;z-index:50;
  min-width:11rem;margin-top:2px;padding:4px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18)
}
.nav-drop.open .sub{display:flex;flex-direction:column;gap:2px}
.nav-drop .sub button{text-align:left;width:100%;background:transparent;border-color:transparent}
.nav-drop .sub button:hover,.nav-drop .sub button.on{background:var(--sf2);border-color:var(--line)}
.nav-drop .sub button.on{color:var(--sf);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:6px}
button:hover{border-color:var(--sf)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sf);outline-offset:1px}
button.on,button.pri{background:var(--sf);color:#fff8ea;border-color:var(--sf)}
button.sm{padding:2px 8px;font-size:.85rem;background:#fbf8f0!important;color:#2b2416!important;border:1px solid #d9cfb8!important}
button.sm:hover{border-color:#8a3b12!important;background:#f0e6d4!important}
button.del{color:#a33!important}
button.sm.del{color:#a33!important;background:#fbf8f0!important}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stats div{background:var(--sf2);padding:6px 14px;border-radius:6px}.stats b{font-size:1.3rem;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.room{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);padding:12px;border-radius:6px}
.room.full{border-left-color:var(--sf)}.room.over{border-left-color:var(--bad)}.room.un{border-left-color:var(--mut);border-style:dashed}
.room h3{margin:0;display:flex;justify-content:space-between;gap:8px;font-size:1.1rem}
.cap{font-size:.85rem;color:var(--mut);font-weight:400}
.g{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.g small{display:block;color:var(--mut)}
.empty{color:var(--mut);padding:8px 0;font-size:.9rem}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
table{width:100%;border-collapse:collapse;background:var(--card)}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.95rem}
.scroll{overflow-x:auto}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);padding:14px;border-radius:6px;font:inherit}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:min(520px,94vw);padding:16px;max-height:90vh;overflow-y:auto}
dialog::backdrop{background:#0008}label{display:block;margin:8px 0 2px;font-size:.9rem;color:var(--mut)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--mut)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.form-grid .full{grid-column:1/-1}
.vassa-head{text-align:center;margin-bottom:12px}
.vassa-head h2{margin:0 0 4px;font-size:1.25rem}
.vassa-head p{margin:0;color:#555}
/* ตารางจำพรรษาบังคับโทนสว่างเสมอ (ทั้งหน้าจอ / พิมพ์ / PDF) */
#vassa-print{background:#fff!important;color:#111!important;padding:12px;border-radius:6px;border:1px solid #d9cfb8}
#vassa-print .vassa-head h2{color:#111!important}
#vassa-print .vassa-head p{color:#444!important}
.vassa-table{background:#fff!important;color:#111!important;border-collapse:collapse;width:100%;table-layout:fixed}
.vassa-table th,.vassa-table td{
  border:1px solid #b8ae96!important;
  padding:8px 5px!important;
  font-size:.85rem;
  color:#111!important;
  background:#fff!important;
  vertical-align:middle!important;
  line-height:1.35!important;
  text-align:center;
  overflow-wrap:anywhere;
  word-break:break-word;
  white-space:normal;
  overflow:hidden;
}
.vassa-table th{background:#f0e6d4!important;font-weight:600;color:#2b2416!important;white-space:normal}
.vassa-table tbody tr:nth-child(even) td{background:#faf7f0!important}
.vassa-table td.left{text-align:left}
.meta-box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.meta-box .form-grid{margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--card);padding:4px 12px;border-radius:999px;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--sf);color:#fff8ea;border-color:var(--sf)}
.chip b{margin-left:4px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.dash-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;border-top:4px solid var(--sf)}
.dash-card h3{margin:0 0 8px;font-size:1.05rem}
.dash-card .num{font-size:1.6rem;font-weight:700;color:var(--sf)}
.alert-box{background:#fff3cd;border:1px solid #e6c86a;color:#5c4a12;padding:10px 12px;border-radius:8px;margin-bottom:12px}
.alert-box ul{margin:6px 0 0;padding-left:1.2rem}
.bar-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar-row .lab{min-width:7rem;font-size:.9rem}
.bar-row .bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:var(--sf)}
.bar-row .n{min-width:2rem;text-align:right;font-size:.9rem}
.hist{font-size:.85rem;color:var(--mut);max-height:120px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--card)}
.save-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.save-bar #saveStatus{font-size:.9rem;color:var(--mut);flex:1;min-width:8rem}
button.save-btn{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important;font-weight:600;padding:8px 16px}
button.save-btn:hover{filter:brightness(1.05)}
@media print{.no-print-board .tools,.no-print-board .alert-box,.save-bar{display:none!important}}
@media print{
  @page{size:A4 landscape;margin:1cm}
  header,nav,.tools,button,.stats,.no-print{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  main{max-width:none;padding:0;margin:0}
  .vassa-head h2{font-size:16pt}
  #vassa-print{border:none!important;padding:0!important}
  .vassa-table{page-break-inside:auto;width:100%!important}
  .vassa-table thead{display:table-header-group}
  .vassa-table tr{page-break-inside:avoid;break-inside:avoid}
  .vassa-table{table-layout:fixed!important}
  .vassa-table th,.vassa-table td{border:1px solid #333;padding:5px 3px;font-size:9pt;vertical-align:middle!important;line-height:1.3!important;overflow-wrap:anywhere;word-break:break-word;white-space:normal;overflow:hidden}
  .vassa-table th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  dialog{display:none!important}
}
</style>
</head>
<body>
<header id="hdr"><h1 id="hdr-title">ทะเบียนกุฏิ วัดป่าอารยวังสาราม</h1><p id="hdr-sub">บันทึกพระสงฆ์ผู้มาพัก จัดกุฏิ จำพรรษา และสร้างข้อความแจ้ง</p></header>
<main>
<nav id="tabs"></nav>
<div class="stats" id="stats"></div>
<div id="view"></div>
</main>
<dialog id="dlg"></dialog>
<script>
const KEY='arayawang_kuti_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const THD='๐๑๒๓๔๕๖๗๘๙';
const toThaiNum=s=>String(s??'').replace(/[0-9]/g,d=>THD[+d]);
const toArNum=s=>String(s??'').replace(/[๐-๙]/g,d=>String(THD.indexOf(d)));
const thNum=n=>toThaiNum(n);
const thDate=d=>d?toThaiNum(new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})):'';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pansaVal=g=>+(toArNum(g.pansa||0)||0);
const byPansa=(a,b)=>pansaVal(b)-pansaVal(a)||(a.name||a.first||'').localeCompare(b.name||b.first||'','th');
const byVassaPansa=(a,b)=>pansaVal(b)-pansaVal(a)||(a.first||'').localeCompare(b.first||'','th');

function seedVassaYear(year,place){
 return {
  year:String(year||'2569'),
  place:place||'วัดป่าอารยวังสาราม',
  monks:[
   {id:uid(),first:'พระครูสังฆรักษ์อรัญ',last:'พันธ์ขาว',chaya:'ญาณมโย',age:'42',pansa:'18',vassaWat:place||'วัดป่าอารยวังสาราม',ordDate:'24 กรกฎาคม 2551',ordWat:'วัดล้านนาญาณสังวราราม',ordAmp:'จอมทอง',province:'เชียงใหม่',status:'ปกติ'},
   {id:uid(),first:'พระพีระสันต์',last:'พันธ์ขาว',chaya:'ธีรวโร',age:'41',pansa:'6',vassaWat:place||'วัดป่าอารยวังสาราม',ordDate:'22 กุมภาพันธ์ 2562',ordWat:'วัดป่าพุทธพจน์หริภุญไชย',ordAmp:'เมือง',province:'ลำพูน',status:'ปกติ'},
   {id:uid(),first:'พระสุโชติ',last:'โคกศรี',chaya:'จันทโชโต',age:'68',pansa:'5',vassaWat:place||'วัดป่าอารยวังสาราม',ordDate:'11 กรกฎาคม 2564',ordWat:'วัดป่าพุทธพจน์หริภุญไชย',ordAmp:'เมือง',province:'ลำพูน',status:'ปกติ'},
   {id:uid(),first:'พระถาวร',last:'ทาสี',chaya:'ถิรสีโล',age:'60',pansa:'1',vassaWat:place||'วัดป่าอารยวังสาราม',ordDate:'26 กรกฎาคม 2568',ordWat:'วัดป่าพุทธพจน์หริภุญไชย',ordAmp:'เมือง',province:'ลำพูน',status:'ปกติ'}
  ]
 };
}
function seedVassa(){
 const y=seedVassaYear('2569');
 return {current:y.year,records:{[y.year]:y}};
}
function migrateVassa(v){
 if(!v)return seedVassa();
 if(v.records&&typeof v.records==='object'){
  Object.values(v.records).forEach(r=>{
   if(!Array.isArray(r.monks))r.monks=[];
   r.monks.forEach(m=>normalizeMonk(m,r.place||''));
  });
  if(!v.current||!v.records[v.current]){
   const keys=Object.keys(v.records).sort((a,b)=>+b-+a);
   v.current=keys[0]||'2569';
   if(!v.records[v.current])v.records[v.current]=seedVassaYear(v.current);
  }
  return v;
 }
 // รูปแบบเก่า: place/year/monks เดี่ยว → ย้ายเข้า records
 const year=String(v.year||'2569');
 const rec={year,place:v.place||'วัดป่าอารยวังสาราม',monks:Array.isArray(v.monks)?v.monks:[]};
 rec.monks.forEach(m=>normalizeMonk(m,rec.place||''));
 return {current:year,records:{[year]:rec}};
}
function normalizeMonk(m,place){
 if(m.vassaWat===undefined)m.vassaWat=place||'';
 if(!m.status)m.status='ปกติ';
 if(m.birth===undefined)m.birth='';
 if(m.monkId===undefined)m.monkId='';
 if(m.phone===undefined)m.phone='';
 if(m.note===undefined)m.note='';
 if(!Array.isArray(m.statusHistory))m.statusHistory=[];
 return m;
}
const VASSA_STATUS=['ปกติ','ลาสิกขา','ย้ายสังกัด','มรณะภาพ'];
function statusLabel(s){return VASSA_STATUS.includes(s)?s:'ปกติ'}
function statusCell(s){
 const v=statusLabel(s);
 const color=v==='ปกติ'?'#3f6b3a':v==='ลาสิกขา'?'#a33':v==='ย้ายสังกัด'?'#8a3b12':'#555';
 return `<span style="color:${color};font-weight:600">${esc(v)}</span>`;
}
function statusCounts(list){
 const c={ทั้งหมด:list.length};
 VASSA_STATUS.forEach(s=>c[s]=0);
 list.forEach(m=>{const s=statusLabel(m.status);c[s]=(c[s]||0)+1});
 return c;
}
function downloadCsv(filename,rows){
 const bom='\ufeff';
 const csv=rows.map(r=>r.map(c=>{
  const s=String(c??'');
  return /["\n,]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
 }).join(',')).join('\n');
 const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=filename;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function daysUntil(dateStr){
 if(!dateStr)return null;
 const t=new Date(dateStr+'T00:00:00');
 if(isNaN(t))return null;
 const n=new Date();n.setHours(0,0,0,0);
 return Math.round((t-n)/86400000);
}
function vCur(){
 if(!S.vassa.records[S.vassa.current]){
  S.vassa.records[S.vassa.current]=seedVassaYear(S.vassa.current,S.vassa.records[Object.keys(S.vassa.records)[0]]?.place||'วัดป่าอารยวังสาราม');
  S.vassa.records[S.vassa.current].monks=[];
 }
 return S.vassa.records[S.vassa.current];
}
function vYearList(){
 return Object.keys(S.vassa.records).sort((a,b)=>+b-+a);
}

function seedTemple(name){
 const r=[{id:'r1',name:'กุฏิรวม 1',cap:2},{id:'r2',name:'กุฏิรวม 2',cap:2},{id:'r3',name:'กุฏิ 2',cap:1},{id:'r4',name:'เรือนพระชาย',cap:6}];
 const g=(n,room,pansa)=>({id:uid(),name:n,room,pansa:pansa||'',arrive:'2026-10-03',depart:'',note:'',out:false});
 const isDefault=!name||name==='วัดป่าอารยวังสาราม';
 return {
  id:uid(),
  name:name||'วัดป่าอารยวังสาราม',
  branch:isDefault?'สาขาอารยวังสาราม':'',
  notifier:'พระอัฐพล ฐิตภทฺโท',
  rooms:isDefault?r:[{id:uid(),name:'กุฏิ 1',cap:2}],
  guests:isDefault?[
   g('พระครูสังฆรักษ์อรัญ ญาณมโย','r1'),g('พระดิศพันธุ์ วํสธมฺโม','r1'),
   g('พระครูปลัดวีรศักดิ์ สีลธโร','r2'),g('พระครูใบฎีกา ปิยธิป ปิยธมฺโม','r2'),
   g('พระอุดร อธิวโร','r3'),
   g('พระสหรัฐ ปญฺญาวฑฺฒโก','r4'),g('พระวีรวัฒน์ สุทฺธิสาโร','r4'),g('พระถาวร ทาสี ถิรสีโล','r4')
  ]:[]
 };
}
function seed(){
 const t=seedTemple('วัดป่าอารยวังสาราม');
 return {currentTemple:t.id,temples:{[t.id]:t},vassa:seedVassa()};
}
function migrateTemples(data){
 if(!data)return seed();
 // มีโครงสร้าง temples แล้ว
 if(data.temples&&typeof data.temples==='object'){
  Object.values(data.temples).forEach(t=>{
   if(!Array.isArray(t.rooms))t.rooms=[];
   if(!Array.isArray(t.guests))t.guests=[];
   if(t.branch===undefined)t.branch='';
   t.guests.forEach(g=>{
    if(g.pansa===undefined)g.pansa='';
    if(!Array.isArray(g.history))g.history=[];
   });
   if(!t.name)t.name='วัดไม่ระบุชื่อ';
   if(!t.id)t.id=uid();
  });
  if(!data.currentTemple||!data.temples[data.currentTemple]){
   const keys=Object.keys(data.temples);
   data.currentTemple=keys[0]||null;
   if(!data.currentTemple){
    const t=seedTemple('วัดป่าอารยวังสาราม');
    data.temples[t.id]=t;data.currentTemple=t.id;
   }
  }
  return data;
 }
 // รูปแบบเก่า: rooms/guests ระดับบน
 const t={
  id:uid(),
  name:'วัดป่าอารยวังสาราม',
  notifier:data.notifier||'พระอัฐพล ฐิตภทฺโท',
  rooms:Array.isArray(data.rooms)?data.rooms:[],
  guests:Array.isArray(data.guests)?data.guests:[]
 };
 t.guests.forEach(g=>{if(g.pansa===undefined)g.pansa=''});
 return {currentTemple:t.id,temples:{[t.id]:t},vassa:data.vassa||seedVassa()};
}
let S;
// ถ้าเปิดจากไฟล์ HTML ที่ส่งออกมา จะมีข้อมูลฝังไว้ใน __PORTABLE_DATA__
if(typeof window.__PORTABLE_DATA__!=='undefined'&&window.__PORTABLE_DATA__){
 try{S=window.__PORTABLE_DATA__;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){S=window.__PORTABLE_DATA__}
}else{
 try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
}
S=migrateTemples(S);
S.vassa=migrateVassa(S.vassa);
let tab='board',q='',vq='',vsFilter='ทั้งหมด',vsWatFilter='',crossQ='';
let lastSavedAt=null;
const save=()=>{
 try{
  localStorage.setItem(KEY,JSON.stringify(S));
  lastSavedAt=new Date();
  updateSaveStatus();
 }catch(e){console.error(e)}
};
function updateSaveStatus(){
 const el=document.getElementById('saveStatus');
 if(!el)return;
 if(lastSavedAt){

function matchVassaMonk(x,q){
 if(!q)return true;
 const qq=String(q).trim().toLowerCase();
 if(!qq)return true;
 const s=[x.first,x.last,x.chaya,x.vassaWat,x.province,x.ordWat,x.status,x.monkId,x.phone,x.note]
  .map(v=>String(v??'').toLowerCase()).join(' ');
 return s.includes(qq);
}
function vassaWatKey(x,place){
 return String(x.vassaWat||x._place||place||'').trim()||'(ไม่ระบุวัดที่จำพรรษา)';
}
function vassaWatList(yearMonks,place){
 const map={};
 (yearMonks||[]).forEach(m=>{
  const k=vassaWatKey(m,place);
  if(!map[k])map[k]=0;
  map[k]++;
 });
 return Object.entries(map).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'th'));
}
function searchVassaMonks(){
 const q=String(vq||'').trim();
 const r=vCur();
 const place=r.place||'';
 let list;
 if(!q){
  list=vMonks().map(x=>({...x,_year:r.year||S.vassa.current,_place:place}));
 }else{
  list=[];
  vYearList().forEach(y=>{
   const rec=S.vassa.records[y];
   if(!rec||!rec.monks)return;
   rec.monks.forEach(x=>{
    if(matchVassaMonk(x,q))list.push({...x,_year:y,_place:rec.place||''});
   });
  });
  list.sort(byVassaPansa);
 }
 if(vsFilter&&vsFilter!=='ทั้งหมด')list=list.filter(x=>statusLabel(x.status)===vsFilter);
 // กรองเฉพาะวัดที่จำพรรษา (ไม่ใช่วัดบรรพชา)
 if(vsWatFilter)list=list.filter(x=>vassaWatKey(x,place)===vsWatFilter);
 return list;
}

  </div>`;
 }else{

   <b>สรุปจำนวนตามวัดที่จำพรรษา</b> <span class="hint">(ปี ${toThaiNum(year)} · ไม่ใช่วัดบรรพชา)</span>

    </table>

 }

function doAddVassaYear(){
 const y=$('#ny').value.trim().replace(/\D/g,'');
 if(!y){$('#ny').focus();return}
 if(S.vassa.records[y]){alert('มีปี พ.ศ. '+y+' อยู่แล้ว');return}
 const place=$('#np').value.trim()||'วัดป่าอารยวังสาราม';
 const copy=$('#ncopy').checked;
 const monks=copy?vCur().monks.map(m=>({...m,id:uid(),vassaWat:m.vassaWat||place})):[] ;
 S.vassa.records[y]={year:y,place,monks};
 S.vassa.current=y;vq='';
 save();$('#dlg').close();render();

function delVassaYear(){
 const y=S.vassa.current;
 const years=vYearList();

 delete S.vassa.records[y];
 S.vassa.current=vYearList()[0];
 vq='';save();render();
}

 });

function saveVassaMonk(id){
 const r=vCur();
 const old=id?r.monks.find(x=>x.id===id):null;
 const newStatus=statusLabel($('#vst').value);
 const v={
  first:$('#vf').value.trim(),
  last:$('#vl').value.trim(),
  chaya:$('#vc').value.trim(),
  age:$('#va').value.trim(),
  pansa:$('#vpansa').value.trim()===''?'':String(Math.max(0,+$('#vpansa').value||0)),
  birth:$('#vbirth').value.trim(),
  monkId:$('#vid').value.trim(),
  phone:$('#vphone').value.trim(),
  vassaWat:$('#vvw').value.trim(),
  ordDate:$('#vod').value.trim(),
  ordWat:$('#vow').value.trim(),
  ordAmp:$('#voa').value.trim(),
  province:$('#vpr').value.trim(),
  note:$('#vnote').value.trim(),
  status:newStatus
 };
 if(!v.first){$('#vf').focus();return}
 if(id&&old){
  const hist=Array.isArray(old.statusHistory)?old.statusHistory.slice():[];
  if(statusLabel(old.status)!==newStatus){
   hist.push({date:today(),from:statusLabel(old.status),to:newStatus,reason:($('#vreason')?.value||'').trim()});
  }
  Object.assign(old,{...v,statusHistory:hist});
 }else{
  r.monks.push({id:uid(),...v,statusHistory:newStatus!=='ปกติ'?[{date:today(),from:'—',to:newStatus,reason:($('#vreason')?.value||'').trim()}]:[]});
 }
 save();$('#dlg').close();render();
}

function hasTravelDates(g){
 // รวมในข้อความแจ้งเฉพาะผู้มีวันเข้าพักและวันออกครบ
 return !!(g&&String(g.arrive||'').trim()&&String(g.depart||'').trim());
}
function msgText(){
 // เฉพาะพระที่มีวันเข้า–ออก (เดินทางร่วมศาสนกิจ) — ไม่รวมผู้พักที่ไม่มีวันที่
 const c=cur().filter(hasTravelDates);
 const wat=tCur().name||'วัด';
 let t='ขอโอกาสครับแจ้งคณะสงฆ์ ที่เดินทางเพื่อร่วมศาสนากิจ โดยจัดที่พัก ณ.'+wat+' ดังนี้ ครับ\n\n';
 if(!c.length){
  t+='(ยังไม่มีรายชื่อที่มีวันเข้าพักและวันออก)\n';
 }else{
  c.forEach((g,i)=>t+=thNum(i+1)+'.'+g.name+(g.pansa!==''&&g.pansa!=null?' ('+toThaiNum(g.pansa)+' พรรษา)':'')+'\n');
  rooms().forEach(r=>{
   const o=inRoom(r.id).filter(hasTravelDates);
   if(!o.length)return;
   t+='\n🏠'+r.name+'\n';
   o.forEach((g,i)=>t+=toThaiNum(i+1)+'.'+g.name+(g.pansa!==''&&g.pansa!=null?' ('+toThaiNum(g.pansa)+' พรรษา)':'')+'\n');
  });
  const un=c.filter(g=>!rooms().some(r=>r.id===g.room));
  if(un.length){
   t+='\n⚠️ยังไม่ได้จัดกุฏิ\n';
   un.forEach((g,i)=>t+=toThaiNum(i+1)+'.'+g.name+(g.pansa!==''&&g.pansa!=null?' ('+toThaiNum(g.pansa)+' พรรษา)':'')+'\n');
  }
 }
 t+='\n…………………………………………\nแจ้งเมื่อวันที่ '+thDate(today())+'\n'+(tCur().notifier||'');
 return t;
}

function exportPortableHtml(){
 try{
  // ข้อมูลปัจจุบัน (escape ให้ไม่ทำลายแท็ก script)
  const data=JSON.stringify(S)
   .replace(/</g,'\\u003c')
   .replace(/>/g,'\\u003e')
   .replace(/\u2028/g,'\\u2028')
   .replace(/\u2029/g,'\\u2029');
  const styles=[...document.querySelectorAll('style')].map(s=>s.innerHTML).join('\n');
  // ดึงโค้ดโปรแกรมจาก script เดิม แล้วตัดข้อมูลฝังเก่าออก
  let bodyScript=[...document.querySelectorAll('script:not([src])')]
   .map(s=>s.textContent||'')
   .filter(t=>t.length>100)
   .sort((a,b)=>b.length-a.length)[0]||'';
  // ลบ marker / ข้อมูลฝังชุดเก่า ถ้ามี
  bodyScript=bodyScript
   .replace(/\/\*\s*__PORTABLE_EXPORT_MARKER__\s*\*\//g,'')
   .replace(/window\.__PORTABLE_DATA__\s*=\s*\{[\s\S]*?\};/,'')
   .replace(/<\/script/gi,'<\\/script');
  if(!bodyScript.includes('function render')||!bodyScript.includes('const KEY')){
   alert('ไม่สามารถสร้างไฟล์ได้จากหน้านี้\nกรุณาเปิดไฟล์โปรแกรมต้นฉบับ แล้วลองส่งออกอีกครั้ง');
   return;
  }
  const html='<!DOCTYPE html>\n'+
'<html lang="th">\n'+
'<head>\n'+
'<meta charset="utf-8">\n'+
'<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
'<title>ทะเบียนกุฏิ วัดป่าอารยวังสาราม</title>\n'+
'<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">\n'+
'<style>\n'+styles+'\n</style>\n'+
'</head>\n'+
'<body>\n'+
'<header id="hdr"><h1 id="hdr-title">ทะเบียนกุฏิ วัดป่าอารยวังสาราม</h1><p id="hdr-sub">บันทึกพระสงฆ์ผู้มาพัก จัดกุฏิ จำพรรษา และสร้างข้อความแจ้ง</p></header>\n'+
'<main>\n'+
'<nav id="tabs"></nav>\n'+
'<div class="stats" id="stats"></div>\n'+
'<div id="view"></div>\n'+
'</main>\n'+
'<dialog id="dlg"></dialog>\n'+
'<script>\n'+
'/* __PORTABLE_EXPORT_MARKER__ */\n'+
'window.__PORTABLE_DATA__='+data+';\n'+
bodyScript+'\n'+
'</scr'+'ipt>\n'+
'</body>\n'+
'</html>\n';
  const blob=new Blob(['\ufeff',html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  a.href=url;
  a.download='ทะเบียนกุฏิ-อารยวังสาราม-'+stamp+'.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  alert('ส่งออกไฟล์ HTML แล้ว\n\nวิธีใช้:\n1. บันทึกไฟล์ลงเครื่อง\n2. เปิดด้วย Chrome / Safari / Edge\n3. ข้อมูลรายชื่อจะโหลดครบอัตโนมัติ');
 }catch(e){
  console.error(e);
  alert('ส่งออกไม่สำเร็จ: '+(e.message||e));
 }
}

function report(){
 const years=vYearList();
 const ySel=S.vassa.current;
 const rec=S.vassa.records[ySel]||{monks:[]};
 const monks=rec.monks||[];
 const byWat={},byProv={},byPansa={};
 monks.forEach(m=>{
  const w=m.vassaWat||rec.place||'(ไม่ระบุ)';
  const p=m.province||'(ไม่ระบุ)';
  const ps=String(m.pansa??'')===''?'(ไม่ระบุ)':String(m.pansa);
  byWat[w]=(byWat[w]||0)+1;
  byProv[p]=(byProv[p]||0)+1;
  byPansa[ps]=(byPansa[ps]||0)+1;
 });
 const max=arr=>Math.max(1,...Object.values(arr));
 const bars=(obj)=>{
  const mx=max(obj);
  return Object.entries(obj).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'th')).map(([k,n])=>`
   <div class="bar-row"><span class="lab">${esc(k)}</span><span class="bar"><i style="width:${Math.round(n/mx*100)}%"></i></span><span class="n">${toThaiNum(n)}</span></div>`).join('')||'<p class="empty">ไม่มีข้อมูล</p>';
 };
 const yearOpts=years.map(y=>`<option value="${esc(y)}" ${y===ySel?'selected':''}>${toThaiNum(y)}</option>`).join('');
 const sc=statusCounts(monks);
 // สรุปรายปีทุกปี
 const yearRows=years.map(y=>{
  const ms=S.vassa.records[y]?.monks||[];
  const c=statusCounts(ms);
  return `<tr><td>${toThaiNum(y)}</td><td>${toThaiNum(c['ทั้งหมด']||0)}</td><td>${toThaiNum(c['ปกติ']||0)}</td><td>${toThaiNum(c['ลาสิกขา']||0)}</td><td>${toThaiNum(c['ย้ายสังกัด']||0)}</td><td>${toThaiNum(c['มรณะภาพ']||0)}</td></tr>`;
 }).join('');
 $('#view').innerHTML=`
 <div class="tools no-print">
  <label style="margin:0">ปีรายงาน</label>
  <select style="width:auto" onchange="S.vassa.current=this.value;save();report()">${yearOpts}</select>
  <button class="pri" onclick="window.print()">พิมพ์รายงาน</button>
  <button onclick="exportReportExcel()">ส่งออก Excel</button>
 </div>
 <div id="report-print">
  <div class="vassa-head" style="text-align:center">
   <h2>รายงานทะเบียนพระประจำพรรษา</h2>
   <p>${esc(rec.place||'')} · ${toThaiNum(ySel||'')}</p>
  </div>
  <div class="meta-box">
   <b>สรุปสถานะ</b>
   <div class="chips" style="margin-top:8px">
    <span class="chip on">ทั้งหมด <b>${toThaiNum(sc['ทั้งหมด']||0)}</b></span>
    ${VASSA_STATUS.map(s=>`<span class="chip">${s} <b>${toThaiNum(sc[s]||0)}</b></span>`).join('')}
   </div>
  </div>
  <div class="dash-grid">
   <div class="dash-card"><h3>แยกตามวัดที่จำพรรษา</h3>${bars(byWat)}</div>
   <div class="dash-card"><h3>แยกตามจังหวัด</h3>${bars(byProv)}</div>
   <div class="dash-card"><h3>แยกตามพรรษา</h3>${bars(byPansa)}</div>
  </div>
  <div class="meta-box" style="margin-top:14px">
   <b>สรุปรายปีทั้งหมด</b>
   <div class="scroll" style="margin-top:8px">
    <table><tr><th>ปี</th><th>ทั้งหมด</th><th>ปกติ</th><th>ลาสิกขา</th><th>ย้ายสังกัด</th><th>มรณะภาพ</th></tr>
    ${yearRows||'<tr><td colspan="6" class="empty">ยังไม่มีข้อมูล</td></tr>'}
    </table>
   </div>
  </div>
  <p class="hint no-print">ใช้พิมพ์เป็นรายงานเจ้าอาวาส / เจ้าคณะ · เลือกปีด้านบนแล้วกดพิมพ์</p>
 </div>`;
}
function exportReportExcel(){
 const years=vYearList();
 const rows=[['ปี','ทั้งหมด','ปกติ','ลาสิกขา','ย้ายสังกัด','มรณะภาพ']];
 years.forEach(y=>{
  const c=statusCounts(S.vassa.records[y]?.monks||[]);
  rows.push([y,c['ทั้งหมด']||0,c['ปกติ']||0,c['ลาสิกขา']||0,c['ย้ายสังกัด']||0,c['มรณะภาพ']||0]);
 });
 downloadCsv('สรุปจำพรรษารายปี.csv',rows);
}

/* ——— PWA ——— */
let deferredPwaPrompt=null;
function isStandalonePwa(){
 return window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone===true
  || document.referrer.includes('android-app://');
}
function updatePwaUi(){
 const btn=$('#pwaInstallBtn');
 const st=$('#pwaStatus');
 if(!btn)return;
 if(isStandalonePwa()){
  btn.style.display='none';
  if(st)st.textContent='โหมดแอป';
  return;
 }
 if(deferredPwaPrompt){
  btn.style.display='';
  if(st)st.textContent='';
 }else{
  btn.style.display='none';
  // iOS ไม่มี beforeinstallprompt
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(st&&isIOS&&!isStandalonePwa())st.textContent='iOS: แชร์ → เพิ่มไปยังหน้าจอโฮม';
 }
}
async function triggerPwaInstall(){
 if(!deferredPwaPrompt){
  alert('ถ้าไม่เห็นปุ่มติดตั้ง ให้ใช้เมนูเบราว์เซอร์:\n• Chrome: ติดตั้งแอป / Add to Home screen\n• iPhone: แชร์ → เพิ่มไปยังหน้าจอโฮม');
  return;
 }
 deferredPwaPrompt.prompt();
 try{await deferredPwaPrompt.userChoice}catch(e){}
 deferredPwaPrompt=null;
 updatePwaUi();
}
window.addEventListener('beforeinstallprompt',(e)=>{
 e.preventDefault();
 deferredPwaPrompt=e;
 updatePwaUi();
});
window.addEventListener('appinstalled',()=>{
 deferredPwaPrompt=null;
 updatePwaUi();
});
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js').then(()=>{
   const st=$('#pwaStatus');
   if(st&&!isStandalonePwa()&&!/iphone|ipad|ipod/i.test(navigator.userAgent)){
    /* status optional */
   }
  }).catch(err=>console.warn('SW register failed',err));
 });
}

render();
</script>
